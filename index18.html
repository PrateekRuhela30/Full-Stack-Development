<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting card</title>
    <style>
      .container {
        width: 400px;
        height: 250px;
        perspective: 800px;
        margin: 50px auto;
      }
      .card {
        width: 450px;
        height: 250px;
        position: relative;
        transform-style: preserve-3d;
        /* transition: all 3s; */
      }
      .message {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: rgb(255, 213, 0);
      }
      .gate {
        position: absolute;
        top: 0;
        width: 50%;
        height: 100%;
        /* background-color: aliceblue; */
        border: 1px solid black;
        transition: all 3s;
        background: conic-gradient(
          rgb(214, 112, 16) 0deg 90deg,
          rgb(241, 240, 158) 90deg 180deg,
          rgb(214, 112, 16),
          rgb(241, 240, 158)
        );
        background-size: 50px 50px;
      }
      .left {
        left: 0;
        transform-origin: left;
      }
      .right {
        right: 0;
        transform-origin: right;
      }
      .card:hover .left {
        transform: rotateY(-120deg);
      }
      .card:hover .right {
        transform: rotateY(120deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="message">🎉🎉Happy Birthday🎉🎉</div>
        <div class="gate left"></div>
        <div class="gate right"></div>
      </div>
    </div>
  </body>
</html>
