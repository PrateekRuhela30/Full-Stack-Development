<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development</title>
</head>
<body>
    <form action="index1.html" method="get">
        <fieldset>
            <label for="name">Name: </label>
            <input type="text" id ="name" required>
            <br>
            <label for="password">Password: </label>
            <input type="password" id ="password" required>
            <br>
            <br>
            <label for="gender"> Enter your gender:</label>
            <input type="radio" name="gender">male
            <input type="radio" name="gender">female
            <br>
            <br>
            <input type="submit" value="submit">
        </fieldset>
        <select name="cars" id="cars">
            <option value="" selected disabled>Select a car company</option>
            <option value="volvo">Volvo</option>
            <option value="saab">BMW</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
    </form>
    <iframe src="index.html" frameborder="1"></iframe>
        
       <figure>
        <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Trulli" width="500" height="333">
    </figure>
    
    <figcaption>Trulli, Puglia, Italy</figcaption>
</body>
</html>
