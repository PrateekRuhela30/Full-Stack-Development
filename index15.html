<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Effects</title>
    <style>
        .scene{
            width: 100%;
            height: 100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            perspective: 500px;
        }
        .box{
            height: 150px;
            width:150px;
            border:1px solid black;
            transform:rotateY(45deg);
            background-color: #e74c3c;
            margin: 50px auto;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="box"></div>

    </div>
    
</body>
</html>
