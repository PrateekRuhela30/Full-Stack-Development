<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        div{
            border: 2px solid black;
        }
        .container{
            width: 100%;
            height: 100%;
            background-color: lightblue;
            display: grid;
            row-gap: 10px;
            column-gap: 10px;
            padding: 10px;
            grid-template-columns: repeat(3, 1fr);
        }
        .item{
            background-color: rgb(20, 106, 211);
        }
        .center{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header{
            grid-column-start:1 ;
            grid-column-end: 4;
        }
        .footer{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        .sidebar{
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .content{
            grid-column-start:2;
            grid-column-end:4;
        }

    </style>
</head>
<body>
    
    <div class="container">
        <div class="item center header">Header</div>
        <div class="item center sidebar">Sidebar</div>
        <div class="item center">content 1</div>
        <div class="item center">content 2</div>
        <div class="item center content">content 3</div>
        <div class="item center footer">Footer</div>
    </div>
</body>
</html>
