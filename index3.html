<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 10px;
        }
        h1{
            font-family: 'Courier New', Courier, monospace;
            color: aqua;
            font-size: 2rem;   /*it will double the fonr size  respect to root*/
            text-decoration: underline;
            text-align: center;
            text-transform: capitalize;
            text-shadow: 2px 2px 5px black;
            letter-spacing: 2px;
            word-spacing: 20px;
        }
        p{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: red;
            font-style: italic;
            text-align: center; 
            text-shadow: 2px 2px 5px yellow;
        }
        div{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 20px;
        }
        div.first p{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 2em;
            text-transform: uppercase;
            /* text-decoration: line-through; */
            text-shadow: 2px 2px 10px green;
        }
    </style>
</head>
<body>
    <h1>I am learning about font porperties</h1>

    <p>I am going to change the font family</p>

    <div class="first">
        <p>This is a paragraph under parent with class first</p>
        <p>This is second paragraph inside the div element</p>
    </div>
</body>
</html>
